server:
  port: 8080

spring:
  application:
    name: cvchecker
  datasource:
    url: jdbc:postgresql://localhost:5432/CVChecker
    username: dev
    password: Admin12!
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    upload-dir: ./uploads
  security:
    jwt:
      # Nên override bằng biến môi trường APP_SECURITY_JWT_SECRET trong môi trường thật
      secret: ${APP_SECURITY_JWT_SECRET:change-this-secret-to-a-long-random-string}
      access-token-expiration-minutes: 30
