server:
  port: 8080

spring:
  application:
    name: cv-checker
  datasource:
    url: jdbc:postgresql://localhost:5432/cv_checker
    username: dev
    password: Admin!12
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    upload-dir: ./uploads
  security:
    api-key: ${API_KEY:default-secret-key-change-in-prod}
